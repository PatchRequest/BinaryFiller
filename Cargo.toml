[workspace]
resolver = "2"
members = [
    "crates/binary-filler-core",
    "crates/binary-filler-build",
    "crates/binary-filler",
    "crates/binary-filler-cli",
    "crates/binary-filler-smoke",
    "examples/dummy-agent",
]
default-members = [
    "crates/binary-filler-core",
    "crates/binary-filler-build",
    "crates/binary-filler",
    "crates/binary-filler-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/PatchRequest/BinaryFiller"
rust-version = "1.85"

[workspace.dependencies]
binary-filler-core = { path = "crates/binary-filler-core" }
binary-filler-build = { path = "crates/binary-filler-build" }
binary-filler = { path = "crates/binary-filler" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
sha2 = "0.10"
walkdir = "2"
embed-resource = "3.0"
object = { version = "0.36", default-features = false, features = ["read_core", "pe", "std"] }
clap = { version = "4", features = ["derive"] }

# LTO matrix for ops smoketests: cargo build --profile release-lto ...
[profile.release-lto]
inherits = "release"
lto = true
codegen-units = 1

[profile.release-fat-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
